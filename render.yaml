services:
  # Backend API service
  - type: web
    name: digital-forensic-backend
    runtime: node
    buildCommand: npm run install-all && echo "Build complete"
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
  # Frontend static site
  - type: static_site
    name: digital-forensic-frontend
    buildCommand: npm run install-all && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # SPA rewrite: serve index.html for all non-file requests
    routes:
      - path: /*
        destination: /index.html
        methods: [GET, HEAD]
